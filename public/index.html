<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101f"><title>Viral Bharat — Video Hub</title><style>
:root{--bg:#07101f;--panel:rgba(18,31,55,.82);--line:#7894c444;--red:#ff3158;--blue:#27a8ff;--muted:#a9b7cf}*{box-sizing:border-box}body{margin:0;color:#f6f8ff;font-family:system-ui,Arial;background:radial-gradient(ellipse at 0 0,#142b50,transparent 42%),radial-gradient(ellipse at 100% 8%,#421b3b,transparent 34%),var(--bg);min-height:100vh}.wrap{max-width:780px;margin:auto;padding:20px 14px 40px}.brand{display:flex;align-items:center;gap:12px;margin:8px 0 24px}.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--red),#ff794b 45%,var(--blue));display:grid;place-items:center;font-weight:900;box-shadow:0 0 28px #ff315844}.brand h1{font-size:20px;margin:0;letter-spacing:1px}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px;letter-spacing:2px}.glass{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 14px 45px #0005,0 0 28px #238cff10;backdrop-filter:blur(18px)}.login{max-width:440px;margin:10vh auto;padding:25px}.login h2{margin:0 0 8px}.login p{color:var(--muted);font-size:14px;line-height:1.5}input,button{font:inherit}input{width:100%;padding:14px;border:1px solid var(--line);background:#081326;color:white;border-radius:12px;margin:10px 0}.btn{border:0;border-radius:12px;padding:12px 17px;font-weight:750;cursor:pointer;color:white;background:linear-gradient(100deg,var(--red),#e33c79 48%,#277df4)}.secondary{background:#182944!important;border:1px solid var(--line)!important}.hidden{display:none!important}.error{color:#ff8ea4;font-size:13px;min-height:18px}.line{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:17px}.pill{border:1px solid var(--line);border-radius:99px;padding:7px 11px;font-size:12px;color:#c6d5f1}.intro{padding:20px;margin-bottom:18px}.intro h2{margin:0 0 7px;font-size:22px}.intro p{margin:0;color:var(--muted);font-size:14px}.cards{display:grid;gap:14px}.video{padding:12px;text-align:center;overflow:hidden}.thumb{width:100%;aspect-ratio:16/9;border-radius:13px;object-fit:cover;background:linear-gradient(135deg,#233c65,#101b30 60%,#55263c);border:1px solid #ffffff12}.placeholder{width:100%;aspect-ratio:16/9;border-radius:13px;background:linear-gradient(135deg,#233c65,#101b30 60%,#55263c);display:grid;place-items:center;color:#dbeaff;font-size:12px}.video h3{font-size:16px;margin:12px 5px 9px}.meta{color:#b6c7e4;font-size:12px;margin-bottom:11px}.video a{display:inline-block;text-decoration:none;color:white}.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px}.foot{text-align:center;color:#7184a6;font-size:12px;margin-top:25px}.errorbox{padding:12px;color:#ffd1d8}@media(max-width:480px){.brand h1{font-size:18px}.video h3{font-size:14px}}
</style></head><body><div id="loginScreen" class="wrap"><div class="brand"><div class="logo">VB</div><div><h1>VIRAL BHARAT</h1><p>WATCH • DISCOVER • SHARE</p></div></div><section class="glass login"><h2>Welcome to Viral Bharat</h2><p>Enter the viewer password to continue.</p><form id="loginForm"><input id="password" type="password" placeholder="Enter password" autocomplete="current-password" required><button class="btn" style="width:100%">Continue</button><div id="err" class="error" role="status"></div></form></section></div>
<div id="viewer" class="wrap hidden"><div class="brand"><div class="logo">VB</div><div><h1>VIRAL BHARAT</h1><p>VIDEO HUB</p></div><span class="pill" style="margin-left:auto">VIEWER</span></div><div class="line"><span id="pageLabel" class="pill">PAGE</span><button class="btn secondary" id="logout">Lock</button></div><section class="glass intro"><h2 id="pageTitle">Latest Videos</h2><p>Choose a video and tap Watch.</p></section><div id="cards" class="cards"></div><div id="empty" class="glass errorbox hidden">No videos on this page yet.</div><div class="nav"><button class="btn secondary" id="prev">← Previous</button><span id="pageNum" class="pill">1 / 1</span><button class="btn" id="next">Next Page →</button></div><div class="foot">Viral Bharat</div></div>
<script>
const $=id=>document.getElementById(id);let data={pages:[],videos:[]},pageIndex=0;async function api(path,opts={}){const r=await fetch(path,{credentials:'same-origin',headers:{'content-type':'application/json'},...opts});let b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.error||'Request failed');return b}function showViewer(){ $('loginScreen').classList.add('hidden');$('viewer').classList.remove('hidden');loadData()}async function loadData(){try{data=await api('/api/pages');if(!data.pages.length){$('pageTitle').textContent='No pages yet';$('cards').replaceChildren();return}pageIndex=Math.min(pageIndex,data.pages.length-1);render()}catch(e){lock();$('err').textContent=e.message}}
function render(){const p=data.pages[pageIndex];$('pageTitle').textContent=p.title;$('pageLabel').textContent=`PAGE ${pageIndex+1} OF ${data.pages.length}`;$('pageNum').textContent=`${pageIndex+1} / ${data.pages.length}`;$('prev').disabled=pageIndex===0;$('next').disabled=pageIndex===data.pages.length-1;$('prev').style.opacity=pageIndex===0?'.45':'1';$('next').style.opacity=pageIndex===data.pages.length-1?'.45':'1';$('cards').replaceChildren();const list=data.videos.filter(v=>v.page_id===p.id);$('empty').classList.toggle('hidden',list.length>0);for(const v of list){const card=document.createElement('article');card.className='glass video';if(v.photo_url){const img=document.createElement('img');img.className='thumb';img.src=v.photo_url;img.alt=v.title||'Video photo';img.loading='lazy';card.append(img)}else{const ph=document.createElement('div');ph.className='placeholder';ph.textContent='VIDEO PHOTO';card.append(ph)}if(v.title){const h=document.createElement('h3');h.textContent=v.title;card.append(h)}if(v.rating||v.badge){const meta=document.createElement('div');meta.className='meta';meta.textContent=[v.rating?'★ '+v.rating:'',v.badge].filter(Boolean).join(' · ');card.append(meta)}const a=document.createElement('a');a.className='btn';a.href=v.watch_url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Watch Video ↗';card.append(a);$('cards').append(card)}}function lock(){fetch('/api/logout',{method:'POST',credentials:'same-origin'}).catch(()=>{});$('viewer').classList.add('hidden');$('loginScreen').classList.remove('hidden');$('password').value=''}$('loginForm').onsubmit=async e=>{e.preventDefault();$('err').textContent='';try{await api('/api/login',{method:'POST',body:JSON.stringify({password:$('password').value})});showViewer()}catch(e){$('err').textContent=e.message}};$('logout').onclick=lock;$('prev').onclick=()=>{if(pageIndex>0){pageIndex--;render();scrollTo({top:0,behavior:'smooth'})}};$('next').onclick=()=>{if(pageIndex<data.pages.length-1){pageIndex++;render();scrollTo({top:0,behavior:'smooth'})}};api('/api/me').then(x=>{if(x.role)showViewer()}).catch(()=>{});
</script></body></html>
